[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "datadepot"
dynamic = ["version"]
description = "The datadepot library provides a collection of datasets used in the book Data Science Foundations and Machine Learning with Python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
authors = [
    { name = "Jeroen van Raak", email = "j.j.f.vanraak@uva.nl" }
]

urls = { "Homepage" = "https://github.com/vanraak/datadepot" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["datadepot*"]
exclude = ["csv", "pickle", "sourcedata"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
write_to = "datadepot/_version.py"

[project.optional-dependencies]
all = [
    "scikit-learn>=1.6",
    "geopandas>=1.1",
    "tensorflow>=2.18",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "openpyxl",
    "scipy>=1.16",
    "statsmodels>=0.14",
    "imbalanced-learn",
    "patsy>=1.0.2",
]